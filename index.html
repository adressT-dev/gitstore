<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gitstore</title>

<style>
/* =========================================================
   GITSTORE — iOS 26 GLASS UI
   ========================================================= */

:root {
    --bg: #f2f2f7;
    --bg2: rgba(255,255,255,.62);
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.76);
    --border: rgba(0,0,0,.09);
    --text: #111113;
    --muted: #737378;
    --soft: rgba(0,0,0,.045);
    --soft2: rgba(0,0,0,.07);
    --accent: #007aff;
    --green: #34c759;
    --red: #ff3b30;
    --shadow: 0 14px 40px rgba(0,0,0,.08);
    --radius: 22px;
}

[data-theme="dark"] {
    --bg: #101114;
    --bg2: rgba(30,31,35,.68);
    --glass: rgba(31,32,37,.62);
    --glass-strong: rgba(39,40,45,.78);
    --border: rgba(255,255,255,.09);
    --text: #f5f5f7;
    --muted: #a1a1a6;
    --soft: rgba(255,255,255,.055);
    --soft2: rgba(255,255,255,.085);
    --shadow: 0 18px 50px rgba(0,0,0,.28);
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Inter,
        system-ui,
        sans-serif;
    color: var(--text);
    background: var(--bg);
}

body {
    overflow: hidden;
    transition: background .3s ease, color .3s ease;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button,
input,
textarea,
select {
    outline: none;
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {
    height: 74px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    background: var(--glass-strong);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 50;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 185px;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: -.5px;
}

.github-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--soft2);
    border: 1px solid var(--border);
}

.github-mark svg {
    width: 19px;
    height: 19px;
    fill: currentColor;
}

.search {
    flex: 1;
    max-width: 680px;
    height: 44px;
    position: relative;
}

.search input {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    background: var(--soft);
    color: var(--text);
    border-radius: 14px;
    padding: 0 16px 0 42px;
    font-size: 14px;
    transition: .2s;
}

.search input:focus {
    background: var(--glass-strong);
    border-color: rgba(0,122,255,.35);
}

.search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
}

.top-actions {
    margin-left: auto;
    display: flex;
    gap: 7px;
}

.icon-btn,
.small-btn {
    border: 1px solid var(--border);
    background: var(--soft);
    color: var(--text);
    border-radius: 13px;
    min-width: 40px;
    height: 40px;
    padding: 0 13px;
    transition: transform .18s ease, background .18s ease;
}

.icon-btn:hover,
.small-btn:hover {
    background: var(--soft2);
    transform: translateY(-1px);
}

.github-button {
    display: flex;
    align-items: center;
    gap: 7px;
}

/* =========================================================
   LAYOUT
   ========================================================= */

.layout {
    flex: 1;
    min-height: 0;
    display: flex;
}

.sidebar {
    width: 230px;
    flex-shrink: 0;
    padding: 16px 12px;
    border-right: 1px solid var(--border);
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    display: flex;
    flex-direction: column;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.nav-button {
    width: 100%;
    height: 43px;
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: 13px;
    text-align: left;
    padding: 0 13px;
    display: flex;
    align-items: center;
    gap: 11px;
    transition: .18s;
}

.nav-button:hover {
    background: var(--soft);
    color: var(--text);
}

.nav-button.active {
    background: var(--soft2);
    color: var(--text);
    font-weight: 600;
}

.nav-icon {
    width: 20px;
    text-align: center;
}

.sidebar-bottom {
    margin-top: auto;
}

.create-btn {
    width: 100%;
    height: 45px;
    border: 0;
    border-radius: 14px;
    background: var(--text);
    color: var(--bg);
    font-weight: 650;
    transition: .2s;
}

.create-btn:hover {
    transform: translateY(-1px);
    opacity: .88;
}

.main {
    flex: 1;
    min-width: 0;
    overflow: auto;
    scroll-behavior: smooth;
}

.content {
    max-width: 1380px;
    margin: 0 auto;
    padding: 34px;
}

/* =========================================================
   RIGHT PANEL
   ========================================================= */

.right-panel {
    width: 300px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    padding: 20px;
    overflow: auto;
    transition:
        width .3s ease,
        padding .3s ease,
        opacity .2s ease;
}

.right-panel.hidden {
    width: 0;
    padding: 0;
    opacity: 0;
    overflow: hidden;
}

.panel-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 18px;
}

.panel-card {
    padding: 16px;
    border-radius: 17px;
    background: var(--soft);
    border: 1px solid var(--border);
}

.panel-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 8px 0;
    font-size: 13px;
}

.panel-row span:first-child {
    color: var(--muted);
}

.panel-buttons {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 15px;
}

/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.page-title {
    font-size: 36px;
    letter-spacing: -1.3px;
    font-weight: 750;
    margin: 0;
}

.page-subtitle {
    color: var(--muted);
    margin-top: 7px;
    font-size: 15px;
}

.section-title {
    font-size: 21px;
    font-weight: 700;
    margin: 34px 0 15px;
}

.badge {
    display: inline-flex;
    align-items: center;
    height: 25px;
    padding: 0 9px;
    border-radius: 99px;
    background: var(--soft2);
    color: var(--muted);
    font-size: 11px;
}

.badge.green {
    color: var(--green);
}

/* =========================================================
   CARDS
   ========================================================= */

.grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 17px;
}

.card {
    min-height: 245px;
    border-radius: var(--radius);
    background: var(--glass);
    border: 1px solid var(--border);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: var(--shadow);
    padding: 19px;
    display: flex;
    flex-direction: column;
    transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease;
}

.card:hover {
    transform: translateY(-3px);
    border-color: rgba(127,127,127,.25);
}

.app-icon {
    width: 62px;
    height: 62px;
    border-radius: 17px;
    object-fit: cover;
    background: var(--soft2);
    border: 1px solid var(--border);
}

.app-icon-fallback {
    width: 62px;
    height: 62px;
    border-radius: 17px;
    display: grid;
    place-items: center;
    background: var(--soft2);
    font-size: 25px;
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.favorite {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 11px;
    background: var(--soft);
    color: var(--muted);
}

.favorite.active {
    color: #ff9f0a;
}

.card h3 {
    margin: 16px 0 4px;
    font-size: 18px;
    letter-spacing: -.2px;
}

.author {
    color: var(--muted);
    font-size: 12px;
}

.description {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
    margin-top: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-bottom {
    margin-top: auto;
    padding-top: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.primary {
    height: 39px;
    padding: 0 15px;
    border: 0;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    font-weight: 650;
}

.secondary {
    height: 39px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--soft);
    color: var(--text);
}

.danger {
    color: var(--red);
}

.danger:hover {
    background: rgba(255,59,48,.08);
}

/* =========================================================
   APP PAGE
   ========================================================= */

.app-header {
    display: flex;
    gap: 20px;
    align-items: center;
}

.app-large-icon {
    width: 92px;
    height: 92px;
    border-radius: 24px;
    object-fit: cover;
    background: var(--soft2);
    border: 1px solid var(--border);
}

.app-header-info {
    flex: 1;
}

.app-header h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: -1px;
}

.app-header p {
    margin: 7px 0 0;
    color: var(--muted);
}

.app-header-actions {
    display: flex;
    gap: 8px;
}

.glass-box {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow: var(--shadow);
}

.markdown {
    padding: 22px;
    line-height: 1.7;
    color: var(--text);
}

.markdown h1,
.markdown h2,
.markdown h3 {
    letter-spacing: -.5px;
}

.markdown code {
    background: var(--soft2);
    padding: 3px 6px;
    border-radius: 6px;
}

/* =========================================================
   VERSION LIST
   ========================================================= */

.version-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.version {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px;
    border-radius: 16px;
    background: var(--glass);
    border: 1px solid var(--border);
}

.version-main {
    flex: 1;
}

.version-name {
    font-weight: 650;
}

.version-meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-layer {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.28);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.modal-layer.open {
    display: flex;
    animation: fadeIn .2s ease;
}

.modal {
    width: min(720px,100%);
    max-height: 90vh;
    overflow: auto;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    border-radius: 27px;
    box-shadow: 0 30px 80px rgba(0,0,0,.2);
    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);
    padding: 25px;
    animation: modalIn .25s ease;
}

.modal h2 {
    margin: 0 0 21px;
    font-size: 25px;
    letter-spacing: -.6px;
}

.form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.field label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--soft);
    color: var(--text);
    border-radius: 13px;
    padding: 12px 13px;
    resize: vertical;
}

.field textarea {
    min-height: 100px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 17px;
    border-radius: 17px;
    background: var(--glass);
    border: 1px solid var(--border);
}

.setting-title {
    font-weight: 600;
}

.setting-description {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

.switch {
    width: 48px;
    height: 29px;
    position: relative;
}

.switch input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: var(--soft2);
    border: 1px solid var(--border);
    border-radius: 99px;
    transition: .2s;
}

.slider:before {
    content: "";
    position: absolute;
    width: 23px;
    height: 23px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 2px 5px rgba(0,0,0,.2);
    transition: .2s;
}

.switch input:checked + .slider {
    background: var(--green);
}

.switch input:checked + .slider:before {
    transform: translateX(19px);
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translate(-50%,20px);
    z-index: 300;
    padding: 12px 17px;
    border-radius: 14px;
    background: var(--glass-strong);
    border: 1px solid var(--border);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: .25s;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%,0);
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(.97) translateY(8px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

    .right-panel {
        display: none;
    }

    .grid {
        grid-template-columns: repeat(2,1fr);
    }

}

@media (max-width: 760px) {

    .sidebar {
        width: 68px;
        padding: 12px 8px;
    }

    .nav-button {
        justify-content: center;
        padding: 0;
    }

    .nav-button span:not(.nav-icon) {
        display: none;
    }

    .create-btn {
        font-size: 0;
    }

    .create-btn:after {
        content: "+";
        font-size: 22px;
    }

    .brand {
        min-width: auto;
    }

    .brand-name {
        display: none;
    }

    .github-button {
        display: none;
    }

    .content {
        padding: 22px 16px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .page-title {
        font-size: 29px;
    }

    .row {
        grid-template-columns: 1fr;
    }

    .app-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .app-header-actions {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         TOP BAR
         ===================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="github-mark">

                <svg viewBox="0 0 24 24">
                    <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.38 7.86 10.9.58.1.79-.25.79-.56v-2.16c-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.33.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.96 10.96 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.25 5.68.41.35.78 1.04.78 2.1v3.11c0 .31.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
                </svg>

            </div>

            <span class="brand-name">Gitstore</span>

        </div>

        <div class="search">

            <span class="search-icon">⌕</span>

            <input
                id="searchInput"
                placeholder="Search applications..."
                autocomplete="off"
            >

        </div>

        <div class="top-actions">

            <button
                class="small-btn github-button"
                onclick="openGitHub()"
            >
                GitHub
            </button>

            <button
                class="icon-btn"
                onclick="openSettings()"
                title="Settings"
            >
                ⚙
            </button>

        </div>

    </header>


    <!-- =====================================================
         BODY
         ===================================================== -->

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <nav class="nav">

                <button
                    class="nav-button active"
                    data-page="home"
                    onclick="showHome()"
                >
                    <span class="nav-icon">⌂</span>
                    <span>Home</span>
                </button>

                <button
                    class="nav-button"
                    onclick="focusSearch()"
                >
                    <span class="nav-icon">⌕</span>
                    <span>Search</span>
                </button>

                <button
                    class="nav-button"
                    onclick="showDownloads()"
                >
                    <span class="nav-icon">↓</span>
                    <span>Downloads</span>
                </button>

                <button
                    class="nav-button"
                    onclick="showFavorites()"
                >
                    <span class="nav-icon">★</span>
                    <span>Favorites</span>
                </button>

            </nav>

            <div class="sidebar-bottom">

                <button
                    class="create-btn"
                    onclick="openCreateApp()"
                >
                    ＋ Create application
                </button>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="main">

            <div
                class="content"
                id="content"
            ></div>

        </main>


        <!-- RIGHT PANEL -->

        <aside
            class="right-panel hidden"
            id="rightPanel"
        ></aside>

    </div>

</div>


<!-- =========================================================
     MODAL
     ========================================================= -->

<div
    class="modal-layer"
    id="modalLayer"
    onclick="closeModalOutside(event)"
>

    <div
        class="modal"
        id="modal"
    ></div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>
/* =========================================================
   DATA
   ========================================================= */

const STORAGE_KEY = "gitstore_data_v1";
const SETTINGS_KEY = "gitstore_settings_v1";

let state = {
    applications: []
};

let settings = {
    theme: "light",
    language: "ru",
    rightPanel: true
};

let currentAppId = null;


/* =========================================================
   DEFAULT APP
   ========================================================= */

function defaultData() {

    return {
        applications: [
            {
                id: crypto.randomUUID(),
                name: "Gitstore",
                author: "Gitstore Team",
                category: "Development",
                icon: "",
                description:
                    "A modern application store built around GitHub, GitLab and direct releases.",
                screenshots: [],
                readme:
`# Gitstore

Welcome to Gitstore.

Applications can publish their own versions using GitHub, GitLab or direct download links.

## Features

- Version management
- GitHub / GitLab releases
- Direct ZIP / EXE files
- Automatic updates
- README.md
- LICENSE.md`,
                license: "MIT License",
                licenseText:
`# MIT License

Copyright (c) 2026 Gitstore Team

Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files.`,
                autoUpdate: true,
                favorite: false,
                versions: [
                    {
                        id: crypto.randomUUID(),
                        name: "1.0.0",
                        url: "https://example.com/gitstore.zip",
                        source: "Direct URL",
                        date: new Date().toISOString()
                    }
                ]
            }
        ]
    };
}


/* =========================================================
   STORAGE
   ========================================================= */

function loadData() {

    try {

        const saved = localStorage.getItem(
            STORAGE_KEY
        );

        if (saved) {

            state = JSON.parse(saved);

        } else {

            state = defaultData();

            saveData();
        }

    } catch {

        state = defaultData();
    }

    try {

        const savedSettings =
            localStorage.getItem(
                SETTINGS_KEY
            );

        if (savedSettings) {

            settings = {
                ...settings,
                ...JSON.parse(savedSettings)
            };
        }

    } catch {}

    applyTheme();
}


function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}


function saveSettings() {

    localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(settings)
    );
}


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value = "") {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function findApp(id) {

    return state.applications.find(
        app => app.id === id
    );
}


function latestVersion(app) {

    if (!app.versions?.length)
        return null;

    return app.versions[
        app.versions.length - 1
    ];
}


function formatDate(date) {

    try {

        return new Intl.DateTimeFormat(
            settings.language === "ru"
                ? "ru-RU"
                : "en-US",
            {
                year: "numeric",
                month: "short",
                day: "numeric"
            }
        ).format(new Date(date));

    } catch {

        return "";
    }
}


function toast(message) {

    const el =
        document.getElementById("toast");

    el.textContent = message;

    el.classList.add("show");

    setTimeout(
        () => el.classList.remove("show"),
        2200
    );
}


function markdown(text = "") {

    let html = esc(text);

    html = html.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
    );

    html = html.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
    );

    html = html.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
    );

    html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    html = html.replace(
        /\*(.*?)\*/g,
        "<em>$1</em>"
    );

    html = html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    html = html.replace(
        /\n/g,
        "<br>"
    );

    return html;
}

            return (
                app.name.toLowerCase().includes(query) ||
                app.author.toLowerCase().includes(query) ||

                app.description.toLowerCase().includes(query)

   ========================================================= */

function downloadLatest(id) {

    const app = findApp(id);

    if (!app)
        return;

    const version = latestVersion(app);

    if (!version) {

        toast("This application has no versions");

        return;
    }

    downloadVersion(
        id,
        version.id
    );
}


function downloadVersion(appId,versionId) {

    const app = findApp(appId);

    const version =
        app?.versions.find(
            v => v.id === versionId
        );

    if (!version)
        return;

    if (!version.url) {

        toast("No download URL");

        return;
    }

    window.open(
        version.url,
        "_blank",
        "noopener"
    );

    toast(
        `Opening v${version.name}`
    );
}

/* =========================================================
   GITHUB IMPORT
   ========================================================= */

async function importGitHub(appId) {

    const app = findApp(appId);

    if (!app)
        return;

    const repo = prompt(
        "GitHub repository URL:",
        "https://github.com/user/repository"
    );

    if (!repo)
        return;

    const match =
        repo.match(
            /github\.com\/([^\/]+)\/([^\/#?]+)/
        );

    if (!match) {

        toast("Invalid GitHub URL");

        return;
    }

    const owner = match[1];
    const name = match[2]
        .replace(".git","");

    try {

        toast("Loading GitHub releases...");

        const response =
            await fetch(
                `https://api.github.com/repos/${owner}/${name}/releases`
            );

        if (!response.ok)
            throw new Error();

        const releases =
            await response.json();

        let imported = 0;

        for (const release of releases) {

            for (const asset of (
                release.assets || []
            )) {

                if (!/\.(zip|exe|msi|dmg|pkg|deb|appimage|tar\.gz)$/i.test(
                    asset.name
                )) {
                    continue;
                }

                app.versions.push({

                    id: crypto.randomUUID(),

                    name:
                        release.name
                        || release.tag_name
                        || "Unknown",

                    url:
                        asset.browser_download_url,

                    source:
                        "GitHub",

                    date:
                        release.published_at
                        || new Date().toISOString()
                });

                imported++;
            }
        }

        saveData();

        toast(
            imported
            ? `${imported} release files imported`
            : "No downloadable assets found"
        );

        openApp(appId);

    } catch {

        toast(
            "Could not load GitHub releases"
        );
    }
}


/* =========================================================
   GITLAB IMPORT
   ========================================================= */

async function importGitLab(appId) {

    const app = findApp(appId);

    if (!app)
        return;

    const project =
        prompt(
            "GitLab project URL:",
            "https://gitlab.com/user/project"
        );

    if (!project)
        return;

    try {

        const url =
            new URL(project);

        const path =
            url.pathname
                .replace(/^\/|\/$/g,"")
                .split("/")
                .map(encodeURIComponent)
                .join("%2F");

        const api =
            `https://gitlab.com/api/v4/projects/${path}/releases`;

        toast("Loading GitLab releases...");

        const response =
            await fetch(api);

        if (!response.ok)
            throw new Error();

        const releases =
            await response.json();

        let imported = 0;

        for (const release of releases) {

            const assets =
                release.assets?.links || [];

            for (const asset of assets) {

                if (!asset.url)
                    continue;

                app.versions.push({

                    id: crypto.randomUUID(),

                    name:
                        release.name
                        || release.tag_name
                        || "Unknown",

                    url:
                        asset.url,

                    source:
                        "GitLab",

                    date:
                        release.released_at
                        || new Date().toISOString()
                });

                imported++;
            }
        }

        saveData();

        toast(
            imported
            ? `${imported} releases imported`
            : "No downloadable assets found"
        );

        openApp(appId);

    } catch {

        toast(
            "Could not load GitLab releases"
        );
    }
}


/* =========================================================
   DELETE
   ========================================================= */

function deleteApp(id) {

    const app = findApp(id);

    if (!app)
        return;

    const yes =
        confirm(
            `Delete "${app.name}"? This cannot be undone.`
        );

    if (!yes)
        return;

    state.applications =
        state.applications.filter(
            x => x.id !== id
        );

    saveData();

    closeRightPanel();

    showHome();

    toast("Application deleted");
}

function changeTheme(theme) {

    settings.theme = theme;

    applyTheme();

    saveSettings();
}


function changeLanguage(language) {

    settings.language = language;

    saveSettings();

    toast(
        "Language setting saved"
    );
}


function clearLocalData() {

    if (!confirm(
        "Delete all locally stored Gitstore data?"
    )) {
        return;
    }

    localStorage.removeItem(
        STORAGE_KEY
    );

    state = defaultData();

    saveData();

    closeModal();

    showHome();

    toast("Local data reset");
}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(html) {

    document.getElementById(
        "modal"
    ).innerHTML = html;

    document.getElementById(
        "modalLayer"
    ).classList.add("open");
}


function closeModal() {

    document.getElementById(
        "modalLayer"
    ).classList.remove("open");
}


function closeModalOutside(event) {

    if (
        event.target.id ===
        "modalLayer"
    ) {
        closeModal();
    }
}


/* =========================================================
   SEARCH
   ========================================================= */

function focusSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    input.focus();

    input.select();
}


document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        showHome
    );


/* =========================================================
   GITHUB BUTTON
   ========================================================= */

function openGitHub() {

    window.open(
        "https://github.com/",
        "_blank",
        "noopener"
    );
}


/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            closeModal();
        }

        if (
            (event.ctrlKey || event.metaKey)
            &&
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            focusSearch();
        }
    }
);


/* =========================================================
   START
   ========================================================= */

loadData();
showHome();

</script>
